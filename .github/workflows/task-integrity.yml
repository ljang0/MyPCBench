name: Task corpus integrity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "tasks/**"
      - "scripts/validate_tasks.py"
      - ".github/workflows/task-integrity.yml"
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "tasks/**"
      - "scripts/validate_tasks.py"
      - ".github/workflows/task-integrity.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python -m pip install "jsonschema>=4.23,<5"
      - name: Validate task corpus
        run: python scripts/validate_tasks.py --require-jsonschema
