name: Release image freshness

on:
  workflow_dispatch:
    inputs:
      require_date_tag:
        description: "Date tag to require: today, yesterday, YYYY-MM-DD, or none"
        default: "today"
        required: true
  schedule:
    # Run after the external daily VM publisher is expected to finish.
    - cron: "30 9 * * *"

concurrency:
  group: release-image-freshness
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ljang0'
    timeout-minutes: 60
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check Docker Hub secrets
        run: |
          set -euo pipefail
          missing=0
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name repository secret is required for embedded qcow2 freshness verification"
              missing=1
            fi
          done
          exit "$missing"
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Install metadata dependency
        run: python -m pip install --upgrade huggingface_hub
      - name: Verify Docker/HF release image freshness and identity
        run: |
          python scripts/check-release-image-freshness.py \
            --require-date-tag "${{ github.event.inputs.require_date_tag || 'today' }}" \
            --max-latest-age-hours 36 \
            --check-docker-embedded \
            --output results/release_image_freshness.json
