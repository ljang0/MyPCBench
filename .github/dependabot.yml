version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # requirements.txt declares compatibility floors rather than a lock set;
    # do not raise a floor when its existing range already admits the update.
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
